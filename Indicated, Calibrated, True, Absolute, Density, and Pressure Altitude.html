        // State variables
        let currentQuestion = 0;
        let userAnswers = new Array(50).fill(null);
        let randomizedQuestions = [];
        let timeRemaining = 50 * 60; // 50 minutes in seconds
        let timerInterval = null;

        // Shuffle function (Fisher-Yates)
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        // Initialize Quiz with randomized options per question
        function initQuiz() {
            randomizedQuestions = questionBank.map((qObj, index) => {
                // Create indexed options array to track original indices
                let optionsWithIndices = qObj.options.map((opt, i) => ({
                    text: opt,
                    originalIndex: i,
                    exp: qObj.explanations[i]
                }));

                // Randomize options order
                shuffleArray(optionsWithIndices);

                return {
                    question: qObj.q,
                    options: optionsWithIndices,
                    originalCorrectIndex: qObj.correct
                };
            });

            renderGrid();
            loadQuestion(0);
            startTimer();
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeRemaining--;
                let mins = Math.floor(timeRemaining / 60);
                let secs = timeRemaining % 60;
                document.getElementById('timer').innerText = 
                    `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;

                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    submitQuiz();
                }
            }, 1000);
        }

        function renderGrid() {
            const gridContainer = document.getElementById('q-grid');
            gridContainer.innerHTML = '';
            for (let i = 0; i < 50; i++) {
                const btn = document.createElement('div');
                btn.className = 'grid-num';
                btn.id = `grid-item-${i}`;
                btn.innerText = i + 1;
                btn.onclick = () => jumpToQuestion(i);
                gridContainer.appendChild(btn);
            }
        }

        function updateGridStatus() {
            for (let i = 0; i < 50; i++) {
                const item = document.getElementById(`grid-item-${i}`);
                item.className = 'grid-num';
                if (i === currentQuestion) item.classList.add('active');
                if (userAnswers[i] !== null) item.classList.add('answered');
            }
        }

        function loadQuestion(index) {
            currentQuestion = index;
            const qData = randomizedQuestions[index];

            document.getElementById('q-num-label').innerText = `Question ${index + 1} of 50`;
            document.getElementById('q-text').innerText = qData.question;

            const container = document.getElementById('options-container');
            container.innerHTML = '';

            qData.options.forEach((optObj, optIdx) => {
                const optBtn = document.createElement('button');
                optBtn.className = 'option-btn';
                if (userAnswers[index] === optIdx) {
                    optBtn.classList.add('selected');
                }
                optBtn.innerText = optObj.text;
                optBtn.onclick = () => selectOption(optIdx);
                container.appendChild(optBtn);
            });

            // Navigation buttons logic
            document.getElementById('btn-prev').disabled = (index === 0);
            if (index === 49) {
                document.getElementById('btn-next').innerText = 'Finish & Review';
            } else {
                document.getElementById('btn-next').innerText = 'Next';
            }

            updateGridStatus();
        }

        function selectOption(optionIndex) {
            userAnswers[currentQuestion] = optionIndex;
            loadQuestion(currentQuestion);
        }

        function nextQuestion() {
            if (currentQuestion < 49) {
                loadQuestion(currentQuestion + 1);
            } else {
                submitQuiz();
            }
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                loadQuestion(currentQuestion - 1);
            }
        }

        function jumpToQuestion(index) {
            loadQuestion(index);
        }

        function submitQuiz() {
            clearInterval(timerInterval);
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('results-screen').classList.remove('hidden');

            let score = 0;
            const reviewContainer = document.getElementById('review-container');
            reviewContainer.innerHTML = '';

            randomizedQuestions.forEach((qData, qIdx) => {
                const userChoiceIdx = userAnswers[qIdx];
                let isCorrect = false;

                if (userChoiceIdx !== null) {
                    const selectedOpt = qData.options[userChoiceIdx];
                    if (selectedOpt.originalIndex === qData.originalCorrectIndex) {
                        isCorrect = true;
                        score++;
                    }
                }

                // Create review item UI
                const card = document.createElement('div');
                card.className = `review-card ${isCorrect ? 'correct' : 'incorrect'}`;

                let cardHTML = `<div style="font-weight:bold; margin-bottom:0.5rem;">Q${qIdx + 1}: ${qData.question}</div>`;

                qData.options.forEach((optObj, optIdx) => {
                    let optClass = 'opt-review';
                    let label = '';

                    const isUserSelected = (userChoiceIdx === optIdx);
                    const isActualCorrect = (optObj.originalIndex === qData.originalCorrectIndex);

                    if (isUserSelected && isActualCorrect) {
                        optClass += ' user-correct';
                        label = ' (Your Correct Answer)';
                    } else if (isUserSelected && !isActualCorrect) {
                        optClass += ' user-wrong';
                        label = ' (Your Choice)';
                    } else if (!isUserSelected && isActualCorrect) {
                        optClass += ' actual-correct';
                        label = ' (Correct Answer)';
                    }

                    cardHTML += `
                        <div class="${optClass}">
                            <strong>${optObj.text}</strong>${label}
                            <div class="explanation">${optObj.exp}</div>
                        </div>
                    `;
                });

                card.innerHTML = cardHTML;
                reviewContainer.appendChild(card);
            });

            const percentage = Math.round((score / 50) * 100);
            document.getElementById('score-text').innerText = `${percentage}%`;
            document.getElementById('score-detail').innerText = `You scored ${score} out of 50 correct answers.`;
        }

        // Start on load
        window.onload = initQuiz;
    </script>
