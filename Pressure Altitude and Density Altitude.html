        o: ["The altimeter will indicate higher than actual altitude", "The altimeter will indicate lower than actual altitude", "The altimeter will automatically adjust", "The aircraft will climb automatically"],

let questions = [];
let userAnswers = new Array(50).fill(null);
let currentIdx = 0;
let timerInterval = null;
let timeRemaining = 50 * 60; // 50 minutes in seconds

function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
}

function initQuiz() {
    // Process and randomize questions
    questions = rawQuestions.map((q, idx) => {
        let optionsObj = q.o.map((opt, oIdx) => ({
            text: opt,
            isCorrect: oIdx === q.a
        }));
        shuffleArray(optionsObj);
        return {
            id: idx + 1,
            question: q.q,
            options: optionsObj,
            ts: q.ts,
            exp: q.exp
        };
    });

    renderNavGrid();
    renderQuestion(0);
    startTimer();
}

function startTimer() {
    timerInterval = setInterval(() => {
        timeRemaining--;
        let mins = Math.floor(timeRemaining / 60);
        let secs = timeRemaining % 60;
        document.getElementById("timer").innerText = 
            `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;

        if (timeRemaining <= 0) {
            clearInterval(timerInterval);
            submitQuiz();
        }
    }, 1000);
}

function renderNavGrid() {
    const grid = document.getElementById("nav-grid");
    grid.innerHTML = "";
    questions.forEach((_, idx) => {
        const btn = document.createElement("button");
        btn.className = "nav-btn";
        btn.id = `nav-${idx}`;
        btn.innerText = idx + 1;
        btn.onclick = () => jumpToQuestion(idx);
        grid.appendChild(btn);
    });
}

function updateNavGrid() {
    questions.forEach((_, idx) => {
        const btn = document.getElementById(`nav-${idx}`);
        btn.classList.remove("active", "answered");
        if (idx === currentIdx) {
            btn.classList.add("active");
        } else if (userAnswers[idx] !== null) {
            btn.classList.add("answered");
        }
    });
}

function renderQuestion(idx) {
    currentIdx = idx;
    const q = questions[idx];

    document.getElementById("question-number").innerText = `Question ${idx + 1} of 50`;
    document.getElementById("timestamp-ref").innerText = `Video Ref: ${q.ts}`;
    document.getElementById("question-text").innerText = q.question;

    const container = document.getElementById("options-container");
    container.innerHTML = "";

    q.options.forEach((opt, oIdx) => {
        const item = document.createElement("label");
        item.className = "option-item";
        if (userAnswers[idx] === oIdx) {
            item.classList.add("selected");
        }

        item.innerHTML = `
            <input type="radio" name="option" value="${oIdx}" ${userAnswers[idx] === oIdx ? 'checked' : ''} onchange="selectOption(${oIdx})">
            <span>${opt.text}</span>
        `;
        container.appendChild(item);
    });

    document.getElementById("prev-btn").disabled = idx === 0;
    document.getElementById("next-btn").innerText = idx === 49 ? "Skip" : "Next / Skip";

    updateNavGrid();
}

function selectOption(oIdx) {
    userAnswers[currentIdx] = oIdx;
    updateNavGrid();
    
    // Refresh options styling
    const items = document.querySelectorAll(".option-item");
    items.forEach((item, index) => {
        if (index === oIdx) {
            item.classList.add("selected");
        } else {
            item.classList.remove("selected");
        }
    });
}

function navigate(direction) {
    let newIdx = currentIdx + direction;
    if (newIdx >= 0 && newIdx < 50) {
        renderQuestion(newIdx);
    }
}

function jumpToQuestion(idx) {
    renderQuestion(idx);
}

function submitQuiz() {
    clearInterval(timerInterval);

    document.getElementById("quiz-interface").style.display = "none";
    document.getElementById("results-interface").style.display = "block";

    let correctCount = 0;
    let incorrectCount = 0;
    let skippedCount = 0;

    const reviewList = document.getElementById("review-list");
    reviewList.innerHTML = "";

    questions.forEach((q, idx) => {
        const userChoice = userAnswers[idx];
        const isSkipped = userChoice === null;
        const isCorrect = !isSkipped && q.options[userChoice].isCorrect;

        if (isCorrect) correctCount++;
        else if (isSkipped) skippedCount++;
        else incorrectCount++;

        const correctOption = q.options.find(o => o.isCorrect);

        const reviewItem = document.createElement("div");
        reviewItem.className = `review-item ${isCorrect ? 'correct' : (isSkipped ? 'skipped' : 'incorrect')}`;

        reviewItem.innerHTML = `
            <div class="review-q-title">Q${idx + 1}: ${q.question}</div>
            <div class="review-ans"><strong>Your Answer:</strong> ${isSkipped ? '<span style="color:var(--skipped)">Skipped</span>' : q.options[userChoice].text}</div>
            <div class="review-ans"><strong>Correct Answer:</strong> <span style="color:var(--correct)">${correctOption.text}</span></div>
            <div class="explanation"><strong>Explanation (Ref: ${q.ts}):</strong> ${q.exp}</div>
        `;

        reviewList.appendChild(reviewItem);
    });

    document.getElementById("score-display").innerText = `${correctCount} / 50`;
    document.getElementById("correct-count").innerText = `Correct: ${correctCount}`;
    document.getElementById("incorrect-count").innerText = `Incorrect: ${incorrectCount}`;
    document.getElementById("skipped-count").innerText = `Skipped: ${skippedCount}`;
}

window.onload = initQuiz;
</script>
