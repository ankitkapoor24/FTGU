margin-left:0}}</style></head><body><header><h1>Pressure & Density Altitude Challenge</h1><p>50 questions • 50 minutes • Skip and return freely</p></header><main class="wrap"><section id="quiz"><div class="top"><div><b id="count"></b><div class="bar"><div class="fill" id="fill"></div></div></div><div class="timer" id="timer">50:00</div></div><div class="layout"><div class="card"><b id="num"></b><div class="q" id="question"></div><div id="options"></div><div class="ctrl"><button id="prev">Previous</button><button class="skip" id="skip">Skip</button><button class="primary" id="next">Next</button><button class="submit" id="submit">Submit quiz</button></div></div><aside class="side"><b>Question navigator</b><div class="nav" id="nav"></div><small>Green: answered<br>Amber: skipped<br>Outline: current</small></aside></div></section><section id="summary" class="hidden"></section></main><script>const raw=[{"q": "Airport elevation is 2,400 ft and the altimeter setting is 29.52 inHg. What is the approximate pressure altitude?", "o": ["2,800 ft", "2,400 ft", "3,300 ft", "Approximately 1,900 ft after applying an opposite-sign correction"], "a": 0, "e": "PA = 2,400 + (29.92 − 29.52) × 1,000 = 2,800 ft."}, {"q": "At a pressure altitude of 700 ft, OAT is 31°C. Using ISA lapse rate 2°C/1,000 ft and DA ≈ PA + 120(OAT − ISA), what is density altitude?", "o": ["2,788 ft", "700 ft", "3,988 ft", "Approximately 588 ft using sea-level ISA temperature at every altitude"], "a": 0, "e": "ISA temperature is about 13.6°C. DA ≈ 700 + 120(31 − 13.6) = 2,788 ft."}, {"q": "Airport elevation is 0 ft and the altimeter setting is 29.42 inHg. What is the approximate pressure altitude?", "o": ["500 ft", "0 ft", "1,000 ft", "Approximately -400 ft after applying an opposite-sign correction"], "a": 0, "e": "PA = 0 + (29.92 − 29.42) × 1,000 = 500 ft."}, {"q": "At a pressure altitude of 4,300 ft, OAT is 26°C. Using ISA lapse rate 2°C/1,000 ft and DA ≈ PA + 120(OAT − ISA), what is density altitude?", "o": ["6 pproximately 1,136 ft using sea-level ISA temperature at every altitude"], "a": 0, "e": "ISA temperature is about 10.2°C. DA ≈ 2,400 + 120(18 − 10.2) = 3,336 ft."}, {"q": "Airport elevation is 4,000 ft and the altimeter setting is 29.92 inHg. What is the approximate pressure altitude?", "o": ["4,000 ft", "4,000 ft", "4,500 ft", "Approximately 3,100 ft after applying an opposite-sign correction"], "a": 0, "e": "PA = 4,000 + (29.92 − 29.92) × 1,000 = 4,000 ft."}, {"q": "At a pressure altitude of 1,400 ft, OAT is -2°C. Using ISA lapse rate 2°C/1,000 ft and DA ≈ PA + 120(OAT − ISA), what is density altitude?", "o": ["-304 ft", "1,400 ft", "896 ft", "Approximately -2,504 ft using sea-level ISA temperature at every altitude"], "a": 0, "e": "ISA temperature is about 12.2°C. DA ≈ 1,400 + 120(-2 − 12.2) = -304 ft."}, {"q": "Airport elevation is 9,000 ft and the altimeter setting is 29.82 inHg. What is the approximate pressure altitude?", "o": ["9,100 ft", "9,000 ft", "9,600 ft", "Approximately 8,200 ft after applying an opposite-sign correction"], "a": 0, "e": "PA = 9,000 + (29.92 − 29.82) × 1,000 = 9,100 ft."}, {"q": "At a pressure altitude of 4,100 ft, OAT is 27°C. Using ISA lapse rate 2°C/1,000 ft and DA ≈ PA + 120(OAT − ISA), what is density altitude?", "o": ["6,524 ft", "4,100 ft", "7,724 ft", "Approximately 4,324 ft using sea-level ISA temperature at every altitude"], "a": 0, "e": "ISA temperature is about 6.8°C. DA ≈ 4,100 + 120(27 − 6.8) = 6,524 ft."}, {"q": "Airport elevation is 200 ft and the altimeter setting is 30.42 inHg. What is the approximate pressure altitude?", "o": ["-300 ft", "200 ft", "200 ft", "Approximately -1,200 ft after applying an opposite-sign correction"], "a": 0, "e": "PA = 200 + (29.92 − 30.42) × 1,000 = -300 ft."}, {"q": "At a pressure altitude of 5,000 ft, OAT is 8°C. Using ISA lapse rate 2°C/1,000 ft and DA ≈ PA + 120(OAT − ISA), what is density altitude?", "o": ["5,360 ft", "5,000 ft", "6,560 ft", "Approximately 3,160 ft using sea-level ISA temperature at every altitude"], "a": 0, "e": "ISA temperature is about 5.0°C. DA ≈ 5,000 + 120(8 − 5.0) = 5,360 ft."}, {"q": "Airport elevation is 1,250 ft and the altimeter setting is 29.92 inHg. What is the approximate pressure altitude?", "o": ["1,250 ft", "1,250 ft", "1,750 ft", "Approximately 350 ft after applying an opposite-sign correction"], "a": 0, "e": "PA = 1,250 + (29.92 − 29.92) × 1,000 = 1,250 ft."}, {"q": "At a pressure altitude of 6,400 ft, OAT is 14°C. Using ISA lapse rate 2°C/1,000 ft and DA ≈ PA + 120(OAT − ISA), what is density altitude?", "o": ["7,816 ft", "6,400 ft", "9,016 ft", "Approximately 5,616 ft using sea-level ISA temperature at every altitude"], "a": 0, "e": "ISA temperature is about 2.2°C. DA ≈ 6,400 + 120(14 − 2.2) = 7,816 ft."}, {"q": "Airport elevation is 3,000 ft and the altimeter setting is 29.52 inHg. What is the approximate pressure altitude?", "o": ["3,400 ft", "3,000 ft", "3,900 ft", "Approximately 2,500 ft after applying an opposite-sign correction"], "a": 0, "e": "PA = 3,000 + (29.92 − 29.52) × 1,000 = 3,400 ft."}, {"q": "At a pressure altitude of 5,300 ft, OAT is 40°C. Using ISA lapse rate 2°C/1,000 ft and DA ≈ PA + 120(OAT − ISA), what is density altitude?", "o": ["9,572 ft", "5,300 ft", "10,772 ft", "Approximately 7,372 ft using sea-level ISA temperature at every altitude"], "a": 0, "e": "ISA temperature is about 4.4°C. DA ≈ 5,300 + 120(40 − 4.4) = 9,572 ft."}, {"q": "Which statement most precisely defines pressure altitude?", "o": ["Altitude indicated with 29.92 inHg set", "Height above terrain", "GPS height above mean sea level", "Standard-atmosphere altitude corrected for temperature and humidity"], "a": 0, "e": "It is the altitude indicated when the altimeter is set to standard pressure, 29.92 inHg or 1013.25 hPa."}, {"q": "Which statement most precisely defines density altitude?", "o": ["Pressure altitude corrected for nonstandard temperature", "True altitude corrected for instrument error", "Indicated height above the departure runway", "Geometric altitude obtained directly from satellite navigation"], "a": 0, "e": "It is the ISA altitude at which air density equals the existing density."}, {"q": "On a fully standard day, what relationship is expected?", "o": ["Density altitude equals pressure altitude", "Density altitude equals absolute altitude", "Pressure altitude always exceeds field elevation", "Indicated altitude is lower than true altitude by a fixed amount"], "a": 0, "e": "With ISA pressure and temperature, no correction separates pressure and density altitude."}, {"q": "At fixed pressure altitude, which change increases density altitude?", "o": ["Increasing outside air temperature", "Decreasing runway length", "Increasing aircraft weight", "Reducing indicated airspeed while maintaining level flight"], "a": 0, "e": "Warmer air is less dense, so the equivalent density altitude rises."}, {"q": "Why is high density altitude critical during takeoff?", "o": ["It reduces lift and powerplant effectiveness", "It increases all forces equally", "It guarantees a shorter roll", "It changes magnetic variation and compass deviation together"], "a": 0, "e": "Thin air reduces wing, engine, and propeller performance."}, {"q": "Which cockpit action directly displays pressure altitude?", "o": ["Set 29.92 inHg and read the altimeter", "Set runway elevation", "Set local pressure then subtract terrain", "Select GPS altitude and correct it for relative humidity"], "a": 0, "e": "The standard setting references the altimeter to the standard pressure datum."}, {"q": "A lower-than-standard altimeter setting has what effect on pressure altitude at a fixed field?", "o": ["It raises pressure altitude", "It has no effect", "It makes PA equal absolute altitude", "It lowers pressure altitude by twice the setting difference"], "a": 0, "e": "A setting below 29.92 produces a positive pressure correction."}, {"q": "Which quantity is primarily a performance altitude?", "o": ["Density altitude", "Absolute altitude", "Field elevation", "Satellite height above the reference ellipsoid"], "a": 0, "e": "Density altitude represents equivalent air density and associated performance."}, {"q": "If OAT is below ISA at the pressure altitude, what generally follows?", "o": ["Density altitude is lower than pressure altitude", "Density altitude equals indicated altitude", "Density altitude is always higher", "Temperature has no effect on atmospheric density"], "a": 0, "e": "A negative temperature deviation creates a negative density-altitude correction."}, {"q": "What atmospheric property does a conventional altimeter directly sense?", "o": ["Static atmospheric pressure", "Air density", "Outside air temperature", "Geometric distance to mean sea level"], "a": 0, "e": "The instrument senses static pressure and converts it through ISA calibration."}, {"q": "Why can equal-elevation airports have different pressure altitudes?", "o": ["Their atmospheric pressures may differ", "Their runway lengths differ", "Their magnetic variations differ", "Their published elevations use unrelated geometric systems"], "a": 0, "e": "Pressure altitude depends on field elevation and local pressure."}, {"q": "Which combination most strongly creates high density altitude?", "o": ["High elevation, low pressure, high temperature", "Low elevation, high pressure, low temperature", "Sea level and ISA conditions", "Low field elevation with a headwind and falling humidity"], "a": 0, "e": "All three listed factors in the correct answer reduce density or raise equivalent altitude."}, {"q": "What is standard sea-level pressure in inches of mercury?", "o": ["29.92 inHg", "30.92 inHg", "28.92 inHg", "Approximately 31.50 inHg after correcting for ISA temperature"], "a": 0, "e": "ISA uses 29.92 inHg."}, {"q": "What is the corresponding standard pressure in hectopascals?", "o": ["1013.25 hPa", "1000.00 hPa", "1023.25 hPa", "Approximately 980 hPa after correcting for field elevation"], "a": 0, "e": "29.92 inHg corresponds to 1013.25 hPa."}, {"q": "For otherwise identical departures, which normally has the longer ground roll?", "o": ["The one at higher density altitude", "The one at lower density altitude", "The one with higher pressure", "The one at equal density altitude but lower published field elevation"], "a": 0, "e": "High DA reduces acceleration, lift generation, and often propulsive output."}, {"q": "Why does a normally aspirated engine lose power as density altitude rises?", "o": ["Less oxygen mass enters each cycle", "Fuel gains energy", "Compression becomes zero", "Ignition timing retards solely because airport elevation increases"], "a": 0, "e": "Lower-density charge contains less oxygen mass for combustion."}, {"q": "Why does propeller efficiency generally degrade in thin air?", "o": ["The blades act on less air mass", "Its diameter contracts", "Pitch always moves coarse", "Rotational speed falls regardless of throttle and engine condition"], "a": 0, "e": "A propeller has less air mass to accelerate."}, {"q": "Why does climb performance usually decline at high density altitude?", "o": ["Excess power or thrust is reduced", "Aircraft mass increases", "Best-angle speed becomes zero", "The pressure altimeter prevents climbing above field elevation"], "a": 0, "e": "Reduced aerodynamic and propulsive performance decreases excess power or thrust."}, {"q": "How does higher humidity affect density, all else equal?", "o": ["It slightly lowers air density", "It greatly raises density", "It exactly duplicates pressure", "It always adds a fixed 1,000 ft to pressure altitude"], "a": 0, "e": "Water vapour is lighter than the dry-air molecules it displaces."}, {"q": "Why is pressure altitude used in performance charts?", "o": ["It standardizes pressure to the ISA datum", "It measures runway slope", "It removes aircraft weight", "It converts performance into geometric height above terrain"], "a": 0, "e": "It provides a common atmospheric pressure reference for performance data."}, {"q": "Which input is intentionally absent from a basic pressure-altitude calculation?", "o": ["Outside air temperature", "Altimeter setting", "Field elevation", "The standard pressure reference of 29.92 inches of mercury"], "a": 0, "e": "Temperature is introduced when converting pressure altitude to density altitude."}, {"q": "Standard pressure exists at the field but OAT is far above ISA. What follows?", "o": ["Density altitude exceeds field elevation", "Density altitude becomes zero", "Pressure altitude is invalid", "The static system becomes independent of atmospheric pressure"], "a": 0, "e": "High temperature raises DA even when pressure is standard."}, {"q": "Which condition can produce density altitude below sea level?", "o": ["Very cold high pressure near sea level", "Hot low pressure at altitude", "ISA conditions on a mountain", "Warm humid air combined with a low altimeter setting"], "a": 0, "e": "Negative pressure altitude and cold-temperature correction can combine below zero."}, {"q": "Why is density altitude not actual geometric altitude?", "o": ["It is an equivalent ISA density level", "It is radar-only height", "It equals height above ground", "It is geometric position corrected only for latitude and local gravity"], "a": 0, "e": "It describes matching density in ISA, not physical position."}, {"q": "Using sea-level ISA temperature instead of ISA temperature at altitude usually causes what warm-day error?", "o": ["Density altitude is underestimated", "Density altitude is exact", "Density altitude is overestimated", "Only pressure altitude changes while calculated density altitude remains fixed"], "a": 0, "e": "The assumed ISA benchmark is too warm, shrinking the calculated temperature deviation."}, {"q": "Which distinction between local and standard altimeter settings is correct?", "o": ["Local setting supports indicated altitude; standard yields pressure altitude", "Local yields DA; standard yields true altitude", "Both always read the same", "Standard setting corrects local temperature and humidity automatically"], "a": 0, "e": "Local pressure supports MSL altitude indication; 29.92 provides pressure altitude."}, {"q": "What does “the airplane feels higher” mean in a density-altitude discussion?", "o": ["Performance resembles a higher ISA altitude", "The aircraft rises without climbing", "The altimeter overreads by DA", "Cabin pressure changes independently of outside atmospheric conditions"], "a": 0, "e": "The phrase refers to equivalent density and performance, not physical position."}, {"q": "If temperature drops 10°C at fixed pressure altitude, how does approximate DA change?", "o": ["It decreases about 1,200 ft", "It decreases about 100 ft", "It increases about 1,200 ft", "It remains constant because pressure altitude already includes temperature correction"], "a": 0, "e": "At roughly 120 ft per °C, a 10°C decrease lowers DA by about 1,200 ft."}, {"q": "Which calculation sequence is conceptually correct?", "o": ["Find PA, find ISA temperature there, then apply temperature deviation", "Find DA first, then infer PA from runway length", "Correct elevation for humidity and ignore pressure", "Use indicated airspeed to calculate pressure altitude before weather data"], "a": 0, "e": "Density-altitude estimation begins with PA and then adjusts for OAT relative to ISA at PA."}, {"q": "What is the best operational use of computed density altitude?", "o": ["Assess takeoff and climb with approved performance data", "Replace every aircraft limitation", "Determine magnetic heading", "Set the altimeter to display height above the runway automatically"], "a": 0, "e": "Use DA with the aircraft flight manual or POH and current conditions for performance planning."}];function sh(a){for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}let last=-1;const qs=raw.map(q=>{let order,pos;do{order=sh([0,1,2,3]);pos=order.indexOf(q.a)}while(pos===last);last=pos;return {...q,order,correct:po class="result"><b>${i+1}. ${esc(q.q)}</b> <strong class="${ok?'good':'bad'}">${a==null?'Unanswered':ok?'Correct':'Incorrect'}</strong><p><b>Your answer:</b> ${a==null?'No answer':esc(q.o[q.order[a]])}<br><b>Correct answer:</b> ${esc(q.o[q.order[q.correct]])}</p><div class="ex"><b>Explanation:</b> ${esc(q.e)}</div></div>`});h+=`<p><small>Educational use only. Verify operational calculations using current official weather and the approved aircraft flight manual or POH.</small></p></div>`;$('summary').innerHTML=h;$('summary').classList.remove('hidden');scrollTo(0,0)}render();</script></body></html>
